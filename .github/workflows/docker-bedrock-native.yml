name: Docker Bedrock Native

on:
  workflow_dispatch:
  push:
    branches: [main, feat/bedrock-converse-stream-route]
    paths:
      - "Dockerfile"
      - "docker-bake.hcl"
      - "headroom/**"
      - "crates/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-bedrock-native.yml"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Normalize image name
        id: image-name
        run: |
          image_name="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"

      - name: Compute short SHA
        id: short-sha
        run: printf 'sha=%s\n' "${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=raw,value=bedrock-native-${{ steps.short-sha.outputs.sha }}
            type=raw,value=bedrock-native
            type=ref,event=branch,prefix=bedrock-native-

      - name: Build and push image
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: runtime
          push: true
          set: |
            *.cache-from=type=gha,scope=bedrock-native
            *.cache-to=type=gha,mode=max,scope=bedrock-native
